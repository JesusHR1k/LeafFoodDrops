name: LeafFoodDrops
main: Retro\LeafFoodDrops\Main
version: 1.2.0
api: 5.0.0
author: JesusHR1K
description: Drops random RAW food from leaves with configurable chance and per-world toggle.

commands:
  lf:
    description: Enable or disable LeafFoodDrops per world
    usage: "/lf <on|off> <world>"
    permission: leafdrops.admin

permissions:
  leafdrops.admin:
    default: op
